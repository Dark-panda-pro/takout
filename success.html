<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Registration Successful</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 25px 19px;

      background: #202a33;
      color: #ffffff;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
    }

    .success-container {
      width: 100%;
      max-width: 520px;

      text-align: center;
    }

    .success-icon {
      width: 72px;
      height: 72px;

      margin: 0 auto 25px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background: rgba(52, 199, 89, 0.14);

      color: #34c759;

      font-size: 38px;
      font-weight: 600;
    }

    h1 {
      margin: 0 0 16px;

      color: #ffffff;

      font-size: 30px;
      line-height: 1.2;

      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .message {
      margin: 0 auto;

      max-width: 470px;

      color: #e4e7eb;

      font-size: 18px;
      line-height: 1.55;
    }

    .thank-you {
      margin-top: 30px;

      color: #ffffff;

      font-size: 18px;
      line-height: 1.5;
    }

    .team {
      margin-top: 6px;

      color: #aeb8c3;

      font-size: 16px;
    }

    @media (max-width: 500px) {
      h1 {
        font-size: 27px;
      }

      .message {
        font-size: 17px;
      }
    }
  </style>
</head>

<body>

  <main class="success-container">

    <div class="success-icon">
      ✓
    </div>

    <h1>
      Congratulations!
    </h1>

    <p class="message">
      You have successfully registered for the Mega Campaign.
      You will receive a confirmation SMS shortly.
    </p>

    <p class="thank-you">
      Thank you.
    </p>

    <div class="team">
      — Takeout Team
    </div>

  </main>

</body>
</html>
